<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Collision Repair Safety | Microlearning</title>
  <style>
    @font-face {
    font-family: "Universal Sans";
    src: url("fonts/Universal-Sans-Text-Regular.woff2") format("woff2");
    font-weight: 400;
}

    @font-face {
    font-family: "Universal Sans";
    src: url("fonts/Universal-Sans-Text-Medium.woff2") format("woff2");
    font-weight: 500;
}
    :root{--ink:#393c41;--muted:#62666b;--line:#d9d9d9;--red:#3e6ae1;--red-dark:#2f54b5;--bg:#f4f4f4;--card:#FFFFFF;--good:#1d7a46;--good-bg:#e7f5ed;--warn:#a05b00;--warn-bg:#fff4df;--bad:#a12b35;--bad-bg:#fdebed}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Universal Sans", Arial, sans-serif}
    .shell{min-height:100vh;display:flex;flex-direction:column}.topbar{height:72px;background:#393c41;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 6vw}.brand{font-weight:750;letter-spacing:.02em}.brand span{color:#b9c8ff}.status{font-size:.9rem;color:#c7d4df}.status strong{color:#fff}
    main{width:min(960px,92vw);margin:38px auto 60px;flex:1}.progress-wrap{display:flex;align-items:center;gap:14px;margin-bottom:24px}.progress{height:8px;flex:1;background:#dce1e5;border-radius:9px;overflow:hidden}.progress-bar{height:100%;background:var(--red);width:0;transition:width .3s ease}.step{font-size:.88rem;color:var(--muted);white-space:nowrap}
    .card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 12px 35px rgba(16,24,32,.07);padding:clamp(25px,5vw,52px)}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:.76rem;font-weight:800;color:var(--red)}h1{font-size:clamp(2rem,5vw,3.7rem);line-height:1.08;margin:12px 0 18px;max-width:780px}h2{font-size:clamp(1.55rem,3vw,2.25rem);line-height:1.18;margin:8px 0 16px}h3{margin-top:0}p{max-width:760px}.lead{font-size:1.15rem;color:var(--muted);max-width:720px}.meta{display:flex;flex-wrap:wrap;gap:10px;margin:25px 0}.pill{padding:7px 12px;border-radius:999px;background:#f4f4f4;color:var(--red-dark);font-size:.88rem;font-weight:650}.objectives{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:25px 0}.objective{border:1px solid var(--line);padding:16px;border-radius:12px;background:#fbfcfe}.objective b{display:block;margin-bottom:4px}.objective small{color:var(--muted)}
    .actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}.btn{border-radius:10px;padding:13px 19px;font-weight:750;font-size:1rem;cursor:pointer;transition:.15s transform,.15s background}.btn:hover{transform:translateY(-1px)}.btn.primary{background:#f4f4f4;color:#3e6ae1;border:1px solid #3e6ae1}.btn.primary:hover{background:#e9e9e9;color:#2f54b5}.btn.secondary{background:#eef0f2;color:var(--ink);border:1px solid #d9d9d9}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin:25px 0}.tile{border:1px solid var(--line);border-radius:14px;padding:20px;background:#fbfcfe}.tile .num{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#f4f4f4;color:var(--red-dark);font-weight:800;margin-bottom:12px}.tile h3{margin:0 0 6px}.tile p{color:var(--muted);margin:0}
    .scenario{background:#393c41;color:#fff;border-radius:14px;padding:24px;margin:24px 0}.scenario p{color:#e4e7e9}.choice-grid{display:grid;gap:12px;margin:22px 0}.choice{border:1px solid var(--line);border-radius:12px;padding:16px 18px;background:#fff;text-align:left;cursor:pointer;font:inherit;color:var(--ink)}.choice:hover{border-color:var(--red);background:#f4f4f4}.choice.selected{border:2px solid var(--red);padding:15px 17px;background:#eef2ff}.choice.correct{border-color:var(--good);background:var(--good-bg)}.choice.incorrect{border-color:var(--bad);background:var(--bad-bg)}.feedback{display:none;border-radius:12px;padding:16px 18px;margin-top:16px}.feedback.show{display:block}.feedback.good{background:var(--good-bg);color:#155d36}.feedback.bad{background:var(--bad-bg);color:#7c2029}.callout{border-left:4px solid var(--red);padding:14px 18px;background:#f4f4f4;color:#393c41;margin:22px 0}.icon-row{display:flex;gap:14px;flex-wrap:wrap;margin:20px 0}.icon-card{flex:1 1 140px;text-align:center;border:1px solid var(--line);border-radius:12px;padding:16px}.icon-card .emoji{font-size:2rem;display:block;margin-bottom:6px}.completion{text-align:center}.score{font-size:3.5rem;font-weight:800;color:var(--red);margin:8px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .hotspot-wrap{display:grid;grid-template-columns:minmax(300px,1.2fr) minmax(220px,.8fr);gap:18px;margin:20px 0}.hotspot-card{border:3px solid var(--red);border-radius:4px;background:#FFFFFF;overflow:hidden}.hotspot-header{height:54px;background:#f4f4f4;color:#393c41;border-bottom:1px solid #d9d9d9;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-weight:800;font-size:1.05rem}.hotspot-header span{background:var(--red);color:#FFFFFF;border-radius:999px;padding:5px 10px;font-size:.76rem;letter-spacing:.04em}.vehicle-map{position:relative;min-height:280px;background:#FFFFFF;overflow:hidden}.vehicle-map:before,.vehicle-map:after{display:none}.map-label{position:absolute;bottom:12px;left:14px;color:#393c41;font-size:.76rem;letter-spacing:.04em;font-weight:750}.hotspot{position:absolute;z-index:2;width:36px;height:36px;border:3px solid #FFFFFF;border-radius:50%;background:var(--red);color:#FFFFFF;font-weight:800;cursor:pointer;box-shadow:0 0 0 3px #393c41;animation:pulse 2s infinite}.hotspot:hover,.hotspot.active{background:#FFFFFF;color:var(--red);box-shadow:0 0 0 3px #393c41}.hs-wheel{left:19%;bottom:25%}.hs-hood{right:12%;top:35%}.hs-cable{left:46%;top:28%}.hs-slope{right:22%;bottom:15%}.hotspot-panel{border:1px solid #393c41;border-radius:4px;padding:20px;background:#FFFFFF;align-self:stretch}.hotspot-panel h3{color:var(--red);margin-bottom:8px}.hotspot-panel p{color:var(--muted);margin:0}.hotspot-instruction{font-size:.9rem;color:var(--muted);margin:0 0 8px}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
    footer{border-top:1px solid var(--line);padding:16px 6vw;color:var(--muted);font-size:.82rem;display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}@media(max-width:600px){.topbar{height:64px;padding:0 4vw}.status{font-size:.78rem}main{margin-top:22px}.card{padding:24px}.actions .btn{width:100%}.hotspot-wrap{grid-template-columns:1fr}.vehicle-map{min-height:220px}}
  .collision-guide-image{display:block;width:100%;height:280px;object-fit:contain;padding:18px 8px 32px}.image-credit{margin:6px 14px 14px;color:#62666b;font-size:.72rem;line-height:1.4;text-align:center}

/* Tesla-inspired primary button */
.btn.primary {
  min-width: 160px;
  min-height: 40px;
  padding: 10px 24px;
  border: 3px solid transparent;
  border-radius: 4px;
  background: #3e6ae1;
  color: #ffffff;
  font-size: 14px;
  font-weight: 500;
  line-height: 1.2;
  cursor: pointer;
  transform: none;
  box-shadow: none;
  transition:
    background-color 0.33s ease,
    border-color 0.33s ease,
    color 0.33s ease,
    box-shadow 0.25s ease;
}

.btn.primary:hover:not(:disabled) {
  background: #3457b2;
  color: #ffffff;
  transform: none;
}

.btn.primary:active:not(:disabled) {
  background: #2d58cc;
}

.btn.primary:focus-visible {
  outline: none;
  box-shadow: 0 0 0 2px rgba(62, 106, 225, 0.35);
}

.btn.primary:disabled {
  opacity: 0.45;
  cursor: not-allowed;
  transform: none;
}

.btn.secondary {
  min-width: 160px;
  min-height: 40px;
  padding: 10px 24px;
  border-radius: 4px;
  background: #eef0f2;
  color: var(--ink);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.2;
  transform: none;
  box-shadow: none;
}

.btn.secondary:hover:not(:disabled) {
  background: #eef0f2;
  color: var(--ink);
  border-color: #d9d9d9;
  transform: none;
}

h1, h2, h3,
.btn {
  font-family: "Universal Sans", Arial, sans-serif;
}

h1, h2, h3,
.btn {
  font-weight: 500;
}

.btn {
  letter-spacing: 0;
}

/* WCAG 2.2 support */
.skip-link {
  position: absolute;
  left: 12px;
  top: 12px;
  z-index: 10;
  transform: translateY(-180%);
  background: #ffffff;
  color: #2f54b5;
  border: 3px solid #2f54b5;
  border-radius: 4px;
  padding: 10px 16px;
  font-weight: 500;
  text-decoration: none;
  transition: transform .2s ease;
}
.skip-link:focus {
  transform: translateY(0);
}
button:focus-visible,
.skip-link:focus-visible {
  outline: 3px solid #2f54b5;
  outline-offset: 3px;
}
.btn.primary:focus-visible,
.btn.secondary:focus-visible {
  outline: 3px solid #2f54b5;
  outline-offset: 3px;
  box-shadow: none;
}
.hotspot:focus-visible {
  outline: 3px solid #2f54b5;
  outline-offset: 3px;
}
.screen-heading-focus {
  outline: none;
}
.image-credit {
  max-width: none;
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
    scroll-behavior: auto !important;
  }
  .hotspot,
  .btn:hover {
    animation: none !important;
    transform: none !important;
  }
}

</style>

</head>
<body>
<a class="skip-link" href="#main-content">Skip to main content</a>
<div class="shell">
  <header class="topbar"><div class="brand">MANDATORY TRAINING<span> / COLLISION</span></div><div class="status" id="status" role="status" aria-live="polite">Progress: <strong>0%</strong></div></header>
  <main id="main-content" tabindex="-1">
    <div class="progress-wrap"><div class="progress" role="progressbar" aria-label="Course progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="0% complete"><div class="progress-bar" id="progressBar"></div></div><div class="step" id="step" aria-live="polite">1 of 10</div></div>
    <section class="card" id="screen" aria-live="polite" tabindex="-1"></section>
  </main>
  <footer><span>Collision Repair Safety • Microlearning sample</span><span id="scormState">Local preview mode</span></footer>
</div>
<script>
  // Minimal SCORM 1.2-style adapter: uses a parent LMS API when present and
  // falls back to localStorage for portfolio/demo playback.
  const scorm = (() => {
    let api = null;
    try { api = window.parent && window.parent !== window && (window.parent.API || window.parent.API_1484_11); } catch(e) {}
    const localKey = 'collision-safety-demo-progress';
    const get = (k, fallback='') => api ? (api.LMSGetValue(k) || fallback) : localStorage.getItem(localKey+'-'+k) || fallback;
    const set = (k,v) => { if(api) api.LMSSetValue(k,String(v)); else localStorage.setItem(localKey+'-'+k,String(v)); };
    return { api, initialize(){ if(api) api.LMSInitialize(''); set('cmi.core.lesson_status','incomplete'); }, set, get, commit(){ if(api) api.LMSCommit(''); }, complete(score){ set('cmi.core.score.raw',score); set('cmi.core.score.min','0'); set('cmi.core.score.max','100'); set('cmi.core.lesson_status',score >= 80 ? 'passed' : 'completed'); set('cmi.suspend_data',JSON.stringify({score,completed:true})); this.commit(); } };
  })();
  scorm.initialize();
  const questions = [
    {q:'You arrive at a damaged EV. Which action should happen before removing damaged parts?', options:['Begin disassembly to expose the damage','Verify the vehicle is stabilized and follow the approved high-voltage isolation procedure','Connect a charger so the 12V battery does not drain','Ask a coworker to watch the vehicle'], answer:1, explain:'Stabilization and energy isolation reduce unexpected movement and electrical exposure. Follow the manufacturer and shop procedure before work begins.'},
    {q:'A technician is about to use an unfamiliar restraint-system tool. What is the safest next step?', options:['Use it carefully and learn as you go','Ask an experienced coworker to demonstrate it','Pause and confirm the procedure, required PPE, and tool instructions before use','Substitute a similar-looking tool'], answer:2, explain:'When the task or tool is unfamiliar, pause and verify the approved procedure, PPE, and equipment instructions. Speed never replaces control of the hazard.'}
  ];
  let screenIndex=0, score=0, answered={};
  const screens = [
    {type:'intro'}, {type:'why'}, {type:'ppe'}, {type:'scenario', key:'stability'}, {type:'energy'}, {type:'question', index:0}, {type:'question', index:1}, {type:'scenario', key:'final'}, {type:'summary'}, {type:'complete'}
  ];
  const el = id => document.getElementById(id);
  function render(){
    const item=screens[screenIndex];
    const percent=Math.round(screenIndex/(screens.length-1)*100);
    el('step').textContent=(screenIndex+1)+' of '+screens.length;
    el('progressBar').style.width=percent+'%';
    const progress=el('progressBar').parentElement;
    progress.setAttribute('aria-valuenow',percent);
    progress.setAttribute('aria-valuetext',percent+'% complete');
    el('status').innerHTML='Progress: <strong>'+percent+'%</strong>';
    let html='';
    if(item.type==='intro') html=`<div class="eyebrow">Collision repair • 10-minute microlearning</div><h1>Make the safe move before the repair begins.</h1><p class="lead">A damaged vehicle can hide movement, electrical, chemical, and restraint-system hazards. In this module, you will practice recognizing the common safety issues that can turn a routine repair into an incident.</p><div class="meta"><span class="pill">Scenario-based</span><span class="pill">No prior shop experience required</span><span class="pill">Target score: 80%</span></div><h3>By the end, you will be able to:</h3><div class="objectives"><div class="objective"><b>1. Stabilize</b><small>Identify when a vehicle must be secured before work.</small></div><div class="objective"><b>2. Isolate</b><small>Recognize when energy sources require an approved isolation process.</small></div><div class="objective"><b>3. Protect</b><small>Select safer actions for PPE, tools, and restraint systems.</small></div></div><div class="callout"><b>Your role:</b> You are the technician making the next safe decision. Choose what you would actually do on the job.</div>`;
    if(item.type==='why') html=`<div class="eyebrow">1 / Why this matters</div><h2>Safety is part of the repair plan—not a separate step.</h2><p>Collision damage can change a vehicle's center of gravity, expose stored energy, and make familiar procedures unpredictable. The safest technicians slow down at the moment a hazard changes.</p><div class="grid"><div class="tile"><span class="num">A</span><h3>Look</h3><p>Scan for movement, sharp edges, leaking fluids, exposed wiring, and undeployed restraints.</p></div><div class="tile"><span class="num">B</span><h3>Control</h3><p>Stabilize the vehicle and control energy before reaching into the work area.</p></div><div class="tile"><span class="num">C</span><h3>Confirm</h3><p>Use the approved procedure, tool, PPE, and a second check when the risk is high.</p></div></div><div class="callout"><b>Transfer to the job:</b> If a situation feels different from normal, treat the difference as information—not an inconvenience.</div>`;
    if(item.type==='ppe') html=`<div class="eyebrow">2 / Protect yourself and the work area</div><h2>Start with a controlled work zone.</h2><p>Personal protective equipment is one layer of protection. It works best when paired with hazard identification, equipment controls, and a clear work area.</p><div class="icon-row"><div class="icon-card"><span class="emoji">🧤</span><b>Hand protection</b><br><small>Match gloves to the task and material.</small></div><div class="icon-card"><span class="emoji">🥽</span><b>Eye protection</b><br><small>Protect against fragments and fluids.</small></div><div class="icon-card"><span class="emoji">🥾</span><b>Foot protection</b><br><small>Use approved shop footwear.</small></div><div class="icon-card"><span class="emoji">🎧</span><b>Hearing protection</b><br><small>Use it where noise requires it.</small></div></div><p><b>Before you begin:</b> remove trip hazards, identify the emergency stop or disconnect location, check tool condition, and confirm you know the procedure.</p>`;
    if(item.type==='scenario' && item.key==='stability') html=`<div class="eyebrow">Practice scenario</div><h2>The vehicle is ready—or is it?</h2><div class="scenario"><p><b>Situation:</b> A vehicle has front-end collision damage. One wheel is angled, the hood is open, and the vehicle is on a slight incline. Your coworker says, “We can start pulling the damaged parts now.”</p><p>Inspect the numbered points on the collision-safety graphic, then choose your best next action.</p></div><div class="hotspot-wrap"><div class="hotspot-card"><div class="hotspot-header"><span>Collision Safety Guide</span><span>SELECT A POINT</span></div><div class="vehicle-map" aria-label="Car collision safety guide with four numbered hotspots"><img src="collision-safety-guide.png" alt="Angular electric pickup truck showing the vehicle work area for collision safety inspection" class="collision-guide-image"><button class="hotspot hs-wheel" data-title="1. Vehicle stability" data-copy="A damaged or angled wheel can affect stability. Confirm the vehicle is secured and supported before approaching or removing parts.">1</button><button class="hotspot hs-hood" data-title="2. Open hood and sharp edges" data-copy="An open hood changes the work area. Scan for sharp edges, fluids, damaged components, and anything that could fall or shift.">2</button><button class="hotspot hs-cable" data-title="3. Exposed cable area" data-copy="Damaged wiring may indicate an electrical hazard. Pause and follow the approved isolation and verification procedure before contact.">3</button><button class="hotspot hs-slope" data-title="4. Incline and movement risk" data-copy="A slope increases the possibility of unexpected movement. Do not begin disassembly until the vehicle is stabilized according to shop procedure.">4</button><span class="map-label">CLICK EACH NUMBER TO REVIEW THE SAFETY POINTS</span></div></div><div class="hotspot-panel" id="hotspotPanel"><h3>Start your scan</h3><p>Click a numbered point on the graphic to see the safety issue and the safer action.</p></div></div><div class="choice-grid" id="choices"><button class="choice" data-correct="true">Stop and verify the vehicle is stabilized, supported, and safe to approach.</button><button class="choice">Begin removing parts while your coworker watches the vehicle.</button><button class="choice">Move the vehicle by hand to a flatter area.</button></div><div class="feedback" id="feedback"></div>`;
    if(item.type==='energy') html=`<div class="eyebrow">3 / Control energy before contact</div><h2>“Off” is not the same as “isolated.”</h2><p>Vehicles may contain electrical, mechanical, pneumatic, and stored-energy hazards. For high-voltage systems, airbags, pretensioners, and other restraint components, use the approved manufacturer and shop procedures.</p><div class="grid"><div class="tile"><h3>Recognize</h3><p>Look for warning labels, damaged high-voltage components, exposed conductors, and deployed or undeployed restraints.</p></div><div class="tile"><h3>Follow</h3><p>Use the documented isolation and verification process. Do not improvise with a substitute sequence.</p></div><div class="tile"><h3>Escalate</h3><p>Pause and ask a qualified person when the procedure, equipment, or hazard is unclear.</p></div></div><div class="callout"><b>Remember:</b> Never rely on a dashboard indicator alone to prove a hazardous energy source is controlled.</div>`;
    if(item.type==='question') { const q=questions[item.index]; html=`<div class="eyebrow">Knowledge check ${item.index+1} of 2</div><h2>${q.q}</h2><div class="choice-grid" id="choices">${q.options.map((x,i)=>`<button class="choice" data-index="${i}">${String.fromCharCode(65+i)}. ${x}</button>`).join('')}</div><div class="feedback" id="feedback"></div>`; }
    if(item.type==='scenario' && item.key==='final') html=`<div class="eyebrow">Final job decision</div><h2>One last check before the first cut.</h2><div class="scenario"><p><b>Situation:</b> You notice a damaged cable near the repair area. The service information is open, but you are not sure whether the vehicle's energy-isolation steps have been completed. Production is behind schedule.</p><p>Choose the response that protects people and keeps the repair moving responsibly.</p></div><div class="choice-grid" id="choices"><button class="choice" data-correct="true">Pause the repair, secure the area, and confirm isolation with the qualified person before continuing.</button><button class="choice">Cover the cable and continue because it is not being touched.</button><button class="choice">Move the cable aside with a nonmetallic tool and continue.</button></div><div class="feedback" id="feedback"></div>`;
    if(item.type==='summary') html=`<div class="eyebrow">Apply it on the job</div><h2>The Safe Start routine</h2><p>Before beginning a collision repair task, make this a repeatable habit:</p><div class="grid"><div class="tile"><span class="num">1</span><h3>Scan</h3><p>What changed? What could move, release, cut, shock, or deploy?</p></div><div class="tile"><span class="num">2</span><h3>Secure</h3><p>Is the vehicle, work area, and energy source controlled?</p></div><div class="tile"><span class="num">3</span><h3>Verify</h3><p>Do I have the approved procedure, equipment, and PPE?</p></div><div class="tile"><span class="num">4</span><h3>Speak up</h3><p>Is anything unclear enough that I should pause and escalate?</p></div></div><div class="callout"><b>Motivation for the next repair:</b> A two-minute safe-start check can prevent a much longer interruption—and help everyone go home safely.</div>`;
    if(item.type==='complete') { const pct=Math.round(score/4*100); html=`<div class="completion"><div class="eyebrow">Module complete</div><h2>${pct >= 80 ? 'You practiced the safe decision.' : 'Let’s try that again.'}</h2><div class="score">${pct}%</div><p>You answered ${score} of 4 scored decisions correctly. ${pct >= 80 ? 'You are ready to apply the Safe Start routine on the job.' : 'Review the feedback, then restart the module and try the decisions again.'}</p><div class="callout"><b>Portfolio note:</b> This sample demonstrates measurable objectives, scenario-based practice, immediate feedback, adult-learning relevance, and completion tracking.</div>${pct < 80 ? '<button id="retry" class="btn primary">Try again</button>' : ''}</div>`; scorm.complete(pct); }
    el('screen').innerHTML=html;
    const map=el('screen').querySelector('.vehicle-map');
    if(map){
      map.setAttribute('role','group');
      map.setAttribute('aria-describedby','map-instructions');
      const instruction=map.querySelector('.map-label');
      if(instruction){ instruction.id='map-instructions'; instruction.textContent='SELECT EACH NUMBER TO REVIEW THE SAFETY POINTS'; }
      if(!el('screen').querySelector('.image-credit')){
        const credit=document.createElement('p');
        credit.className='image-credit';
        credit.textContent='AI-generated vehicle illustration for an instructional design prototype; not an official Tesla asset.';
        map.parentNode.insertBefore(credit,map.nextSibling);
      }
    }
    document.querySelectorAll('.feedback').forEach(fb=>{fb.setAttribute('role','status');fb.setAttribute('aria-live','polite');fb.setAttribute('aria-atomic','true');});
    const focusTarget=el('screen').querySelector('h1,h2') || el('screen');
    if(focusTarget!==el('screen')){ focusTarget.classList.add('screen-heading-focus'); focusTarget.setAttribute('tabindex','-1'); }
    focusTarget.focus({preventScroll:true});
    addHandlers(item); addNav(item); if(item.type==='complete' && score < 4){ const retry=document.getElementById('retry'); if(retry) retry.onclick=()=>{score=0;answered={};screenIndex=0;scorm.set('cmi.core.lesson_status','incomplete');scorm.commit();render();}; }
  }
  function addHandlers(item){
    const hotspotPanel=document.getElementById('hotspotPanel');
    if(hotspotPanel){ hotspotPanel.setAttribute('role','status'); hotspotPanel.setAttribute('aria-live','polite'); hotspotPanel.setAttribute('aria-atomic','true'); }
    document.querySelectorAll('.hotspot').forEach(h=>{
      h.setAttribute('aria-label',h.dataset.title);
      h.addEventListener('click',()=>{document.querySelectorAll('.hotspot').forEach(x=>x.classList.remove('active'));h.classList.add('active');const panel=document.getElementById('hotspotPanel');panel.innerHTML='<h3>'+h.dataset.title+'</h3><p>'+h.dataset.copy+'</p>'; });
    });
    const choices=document.querySelectorAll('.choice'); if(!choices.length) return;
    choices.forEach((btn,i)=>btn.addEventListener('click',()=>{
      if(answered[screenIndex]) return; answered[screenIndex]=true; let ok=false, explain='';
      if(item.type==='question'){ ok=i===questions[item.index].answer; explain=questions[item.index].explain; } else { ok=btn.dataset.correct==='true'; explain=ok?'Correct. This controls the hazard before work begins and gives the team a clear point to verify.':'Not quite. The safer choice is to pause, control the hazard, and verify the approved procedure before continuing.'; }
      if(ok) score++; choices.forEach(c=>{c.disabled=true;if(c===btn)c.classList.add(ok?'correct':'incorrect')}); const fb=document.getElementById('feedback'); fb.className='feedback show '+(ok?'good':'bad'); fb.innerHTML='<b>'+(ok?'Good call.':'Pause and reconsider.')+'</b> '+explain; const next=document.querySelector('.next'); if(next) next.disabled=false;
    }));
  }
  function addNav(item){ const actions=document.createElement('div'); actions.className='actions';
    if(screenIndex>0 && item.type!=='complete') { const back=document.createElement('button'); back.className='btn secondary'; back.textContent='Back'; back.onclick=()=>{screenIndex--;render()}; actions.append(back); }
    if(item.type!=='complete'){ const next=document.createElement('button'); next.className='btn primary next'; next.textContent=screenIndex===screens.length-2?'Finish module':'Continue'; next.onclick=()=>{screenIndex++;render()}; if(item.type==='scenario'||item.type==='question') next.disabled=!answered[screenIndex]; actions.append(next); }
    if(actions.children.length) el('screen').append(actions);
  }
  render();
</script>
</body>
</html>
